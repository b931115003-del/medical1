<meta name="claude:viewport-fit-sides" content="cover">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">

<style>
/* Travel medical record — high-contrast, mobile-first, 5-language */
:root {
  --bg:          #EEF2F8;
  --surface:     #FFFFFF;
  --red:         #B91C1C;
  --red-soft:    #FEF2F2;
  --red-border:  #FECACA;
  --navy:        #1E3A5F;
  --blue:        #1D4ED8;
  --blue-soft:   #EFF6FF;
  --green:       #15803D;
  --green-soft:  #F0FDF4;
  --green-border:#BBF7D0;
  --fg:          #111827;
  --fg-mid:      #374151;
  --muted:       #6B7280;
  --border:      #E5E7EB;
  color-scheme:  light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #0F172A;
    --surface:     #1E293B;
    --red:         #F87171;
    --red-soft:    #1C0A0A;
    --red-border:  #7F1D1D;
    --navy:        #3B82F6;
    --blue:        #60A5FA;
    --blue-soft:   #0F1E3D;
    --green:       #34D399;
    --green-soft:  #052E16;
    --green-border:#065F46;
    --fg:          #F1F5F9;
    --fg-mid:      #CBD5E1;
    --muted:       #64748B;
    --border:      #334155;
    color-scheme:  dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #0F172A;
  --surface:     #1E293B;
  --red:         #F87171;
  --red-soft:    #1C0A0A;
  --red-border:  #7F1D1D;
  --navy:        #3B82F6;
  --blue:        #60A5FA;
  --blue-soft:   #0F1E3D;
  --green:       #34D399;
  --green-soft:  #052E16;
  --green-border:#065F46;
  --fg:          #F1F5F9;
  --fg-mid:      #CBD5E1;
  --muted:       #64748B;
  --border:      #334155;
  color-scheme:  dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans TC', 'Outfit', system-ui, sans-serif;
  padding-block: 1.5rem;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}

.wrap {
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: .9rem;
}

/* ── Language bar ── */
.lang-bar {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}

.lang-btn {
  padding: .38rem .9rem;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  line-height: 1;
}
.lang-btn:hover  { border-color: var(--blue); color: var(--blue); }
.lang-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }

/* ── Emergency header ── */
.emerg-wrap {
  background: var(--red);
  border-radius: 16px;
  padding: 1.1rem 1.3rem;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: .9rem;
}

.emerg-cross { width: 44px; height: 44px; flex-shrink: 0; }

.emerg-text {}

.emerg-label {
  font-family: 'Outfit', sans-serif;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.75);
  line-height: 1;
}

.emerg-name {
  font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: #fff;
  margin-top: .3rem;
  line-height: 1.25;
  text-wrap: balance;
}

.blood-badge {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.blood-lbl  { font-family:'Outfit',sans-serif; font-size:.5rem; font-weight:700; color:var(--red); letter-spacing:.04em; text-transform:uppercase; line-height:1; }
.blood-type { font-family:'Outfit',sans-serif; font-size:1.6rem; font-weight:800; color:var(--red); line-height:1.05; }

/* ── Cards ── */
.card {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .7rem 1.1rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.c-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.c-icon svg { width: 14px; height: 14px; display: block; }
.c-icon.blue  { background: var(--blue-soft);  } .c-icon.blue  svg { fill: var(--blue);  }
.c-icon.red   { background: var(--red-soft);   } .c-icon.red   svg { fill: var(--red);   }
.c-icon.green { background: var(--green-soft); } .c-icon.green svg { fill: var(--green); }

.card-title {
  font-family: 'Outfit', 'Noto Sans TC', sans-serif;
  font-size: .82rem; font-weight: 700; color: var(--fg-mid);
}

.card-body { padding: .85rem 1.1rem; }

/* ── Info rows ── */
.info-row {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  padding: .42rem 0;
  border-bottom: 1px solid var(--border);
}
.info-row:first-child { padding-top: 0; }
.info-row:last-child  { border-bottom: none; padding-bottom: 0; }

.i-label {
  font-family: 'Outfit', sans-serif;
  font-size: .7rem; font-weight: 600; color: var(--muted);
  min-width: 100px; flex-shrink: 0; padding-top: .08rem;
}
.i-value {
  font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  font-size: .88rem; font-weight: 500; color: var(--fg); flex: 1; line-height: 1.4;
}
.i-value.big { font-size: 1rem; font-weight: 700; }

/* ── Condition list ── */
.cond-list { display: flex; flex-direction: column; gap: .5rem; }

.cond-item {
  display: flex; align-items: flex-start; gap: .6rem;
  background: var(--red-soft);
  border: 1px solid var(--red-border);
  border-radius: 10px;
  padding: .55rem .8rem;
}
.cond-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); flex-shrink: 0; margin-top: .38rem;
}
.cond-txt {
  font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  font-size: .86rem; color: var(--fg); line-height: 1.45;
}

/* ── None chip ── */
.none-chip {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .22rem .65rem;
  background: var(--green-soft);
  border: 1px solid var(--green-border);
  border-radius: 100px;
  font-family: 'Outfit', sans-serif;
  font-size: .78rem; font-weight: 600; color: var(--green);
}
.none-chip svg { width: 11px; height: 11px; fill: var(--green); }

/* ── COVID status ── */
.covid-row {
  display: flex; align-items: center; gap: .75rem; padding: .3rem 0;
}
.covid-shield {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--green-soft);
  border: 2px solid var(--green-border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.covid-shield svg { width: 18px; height: 18px; fill: var(--green); }
.covid-label {
  font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  font-size: .92rem; font-weight: 600; color: var(--green);
}

/* ── QR collapsible ── */
.qr-details {
  background: var(--surface);
  border: 1.5px dashed var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.qr-summary {
  display: flex; align-items: center; gap: .55rem;
  padding: .8rem 1.1rem;
  font-family: 'Outfit', sans-serif;
  font-size: .78rem; font-weight: 600; color: var(--muted);
  cursor: pointer; list-style: none; user-select: none;
}
.qr-summary::-webkit-details-marker { display: none; }
.qr-summary svg { width: 15px; height: 15px; fill: var(--muted); flex-shrink: 0; }
.qr-summary .arrow { margin-left: auto; transition: transform .2s; }
details[open] .arrow { transform: rotate(180deg); }
.qr-inner { padding: .3rem 1.1rem 1.1rem; }
.url-row { display: flex; gap: .5rem; margin-bottom: .9rem; }
.url-input {
  flex: 1; min-width: 0;
  padding: .5rem .85rem;
  border: 1.5px solid var(--border); border-radius: 9px;
  font-family: 'Outfit', sans-serif; font-size: .8rem;
  color: var(--fg); background: var(--bg);
  outline: none; transition: border-color .15s;
}
.url-input:focus { border-color: var(--blue); }
.url-input::placeholder { color: var(--muted); }
.gen-btn {
  padding: .5rem 1.1rem; flex-shrink: 0;
  background: var(--navy); color: #fff; border: none;
  border-radius: 9px; font-family: 'Outfit', sans-serif;
  font-size: .78rem; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.gen-btn:hover { background: var(--blue); }
.qr-output {
  display: flex; flex-direction: column; align-items: center; gap: .55rem;
  padding: 1rem; background: var(--bg); border-radius: 10px;
  border: 1px solid var(--border);
}
.qr-output canvas { border-radius: 5px; display: block; }
.qr-hint {
  font-family: 'Outfit', sans-serif;
  font-size: .68rem; color: var(--muted); text-align: center; line-height: 1.5;
}

/* ── Footer ── */
.page-foot {
  text-align: center;
  font-family: 'Outfit', sans-serif;
  font-size: .66rem; color: var(--muted);
  padding-block: .4rem;
  line-height: 1.6;
}
</style>

<div class="wrap">

  <div class="lang-bar">

/* ── Current language ── */
let lang = 'zh';

/* ── Apply translations ── */
function applyLang(l) {
  const t = i18n[l];
  document.getElementById('e-label').textContent     = t.emergLabel;
  document.getElementById('e-title').textContent     = t.emergTitle;
  document.getElementById('e-blood-lbl').textContent = t.bloodLbl;
  document.getElementById('s-personal').textContent  = t.secPersonal;
  document.getElementById('l-name').textContent      = t.lblName;
  document.getElementById('v-name').textContent      = t.valName;
  document.getElementById('l-dob').textContent       = t.lblDob;
  document.getElementById('v-dob').textContent       = t.valDob;
  document.getElementById('l-age').textContent       = t.lblAge;
  document.getElementById('v-age').textContent       = t.valAge;
  document.getElementById('l-blood').textContent     = t.lblBlood;
  document.getElementById('v-blood').textContent     = t.valBlood;
  document.getElementById('s-cond').textContent      = t.secCond;
  document.getElementById('v-cond1').textContent     = t.cond1;
  document.getElementById('v-cond2').textContent     = t.cond2;
  document.getElementById('s-hist').textContent      = t.secHist;
  document.getElementById('l-surgery').textContent   = t.lblSurgery;
  document.getElementById('v-surgery').textContent   = t.none;
  document.getElementById('l-hosp').textContent      = t.lblHosp;
  document.getElementById('v-hosp').textContent      = t.none;
  document.getElementById('s-covid').textContent     = t.secCovid;
  document.getElementById('v-covid').textContent     = t.valCovid;
  document.getElementById('p-footer').textContent    = t.footer;

  // html lang attribute
  const langMap = { zh:'zh-TW', en:'en', ja:'ja', ko:'ko', de:'de' };
  document.documentElement.lang = langMap[l];
}

/* ── Language switcher ── */
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
    applyLang(lang);
  });
});

/* ── QR code generator ── */
let qrInstance = null;

function genQR() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  const output = document.getElementById('qrOutput');
  const container = document.getElementById('qrcode2');
  container.innerHTML = '';
  if (qrInstance) { try { qrInstance.clear(); } catch(e) {} qrInstance = null; }
  output.hidden = false;
  qrInstance = new QRCode(container, {
    text: url, width: 180, height: 180,
    colorDark: '#111827', colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.M
  });
}
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') genQR();
});

/* ── Init ── */
applyLang('zh');
</script>
